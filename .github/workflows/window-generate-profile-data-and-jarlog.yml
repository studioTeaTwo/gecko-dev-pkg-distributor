on:
  workflow_call:
    inputs:
      browser-artifact-name:
        description: 'Artifact to download'
        default: 'ssb-windows-x86_64-build-with-profgen-zstd'
        type: string
      arch:
        description: 'Architecture to output'
        default: 'x86_64'
        type: string
    secrets:
      PAT:
        description: "Personal Access Token"
        required: true
  workflow_dispatch:
    inputs:
      browser-artifact:
        description: 'Artifact to download'
        default: 'ssb-windows-x86_64-build-with-profgen-zstd'
        type: string
      arch:
        description: 'Architecture to output'
        default: 'x86_64'
        type: string

jobs:
  Generate-Profile-data-and-jarlog:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        name: Download artifact 📥
        with:
          name: ${{ inputs.browser-artifact-name }}
          path: C:\artifact

      - name:  Unpack artifact
        shell: bash
        run: |
          cd /c/artifact
          mv ssb-*.tar.zst ssb.tar.zst
          zstd -d ssb.tar.zst
          tar -xf ssb.tar

      - uses: actions/checkout@v4
        name: Clone 🧬
        with:
          submodules: 'recursive'
          token: ${{ secrets.PAT }}
      - name: Apply patch
        shell: bash
        run: |
          for patch in tools/ssi/build/*.patch; do
            echo "Applying $patch"
            git apply "$patch"
          done
          git add .

      - name: Setup 🪛
        shell: powershell
        run: |
          (New-Object System.Net.WebClient).DownloadFile("https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe","C:\MozillaBuildSetup-Latest.exe")
          C:\MozillaBuildSetup-Latest.exe /S | out-null

      - name: Generate 🔄
        shell: bash
        run: |
          export USE_MINTTY=0
          workspace_dir=$(cygpath -u "$GITHUB_WORKSPACE")
          
          echo "cd $workspace_dir" >> mozilla-build-run.sh
          echo 'export PATH=/c/mozilla-build/msys2/usr/bin:$PATH' >> mozilla-build-run.sh
          echo './mach --no-interactive bootstrap --application-choice browser' >> mozilla-build-run.sh
          echo 'LLVM_PROFDATA=/c/Users/runneradmin/.mozbuild/clang/bin/llvm-profdata.exe JARLOG_FILE=en-US.log ./mach python build/pgo/profileserver.py --binary /c/artifact/ssb/ssb.exe' >> mozilla-build-run.sh

          C:/mozilla-build/start-shell.bat "$(cygpath -w mozilla-build-run.sh)"

      - name: Publish 🎁
        uses: actions/upload-artifact@v4
        with:
          name: ssb-windows-${{ inputs.arch }}-profdata-and-jarlog
          path: |
            merged.profdata
            en-US.log
